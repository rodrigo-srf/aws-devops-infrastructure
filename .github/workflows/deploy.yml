name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish and deploy"
        required: true
        default: "manual"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build, push and apply
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: aws-devops-infrastructure
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: Prepare backend config
        working-directory: terraform/environments/dev
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          cat > backend.hcl <<EOF
          bucket       = "$TF_STATE_BUCKET"
          key          = "aws-devops-infrastructure/dev/terraform.tfstate"
          region       = "$AWS_REGION"
          encrypt      = true
          use_lockfile = true
          EOF

      - name: Terraform init
        working-directory: terraform/environments/dev
        run: terraform init -backend-config=backend.hcl

      - name: Terraform apply
        working-directory: terraform/environments/dev
        run: terraform apply -auto-approve -var="image_tag=${{ inputs.image_tag }}"
